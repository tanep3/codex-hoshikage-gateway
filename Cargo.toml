[package]
name = "codex-hoshikage-gateway"
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Tane Channel Technology"]
description = "A private Discord gateway for Codex App Server"

[[bin]]
name = "codex-hoshikage-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
sha2 = "0.10"
hmac = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
